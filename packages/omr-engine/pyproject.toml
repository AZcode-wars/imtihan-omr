[project]
name = "omr-engine"
version = "0.1.0"
description = "OpenOMR image processing engine: fiducial detection, perspective transform, bubble grading."
readme = "README.md"
authors = [
    { name = "AZCode-wars", email = "virzhaazura@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "openomr-schemas",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.33",
    "reportlab>=5.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pymupdf>=2.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv.sources]
openomr-schemas = { path = "../shared-schemas", editable = true }
